<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    body{
      font-family: "Figtree", sans-serif;
      height: 100vh;
      background-color: #F5D04E;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .card{
      border: 2px solid black;
      border-radius: 15px;
      width: 25vw;
      height: auto;
      background-color: #fff;
      padding: 20px;
      box-shadow: 10px 10px rgb(0, 0, 0);
    }
    /* Mobile-first: Default styles for mobile, then override for larger screens */
    @media screen and (max-width: 480px) {
      /* Tablet and desktop styles go here */
      width: 75vw;

    }
  #hero-img{
    border-radius: 15px;
    width: 100%;
    height: auto;
  }
  #label{
    font-weight: bolder;
    display: inline-block;
    background-color: #F5D04E;
    padding: 4px;
    margin: 8px 0px 8px 0px ;
    border-radius: 5px;
  }
  #date{
    font-size: small;
  }
#title{
  font-size: larger;
  font-weight: bolder;
}
#title:hover{
  color: #F5D04E;
}
#intro{
  color: rgba(0, 0, 0, 0.528);

}
#name{
  display: flex;
align-items: center;
gap: 8px;

& >img{
  width: 30px;
  height: auto;
}
& >span{
  font-weight: bolder;
}
}

  </style>
</head>
<body>
<div class="card">
  <img id="hero-img" src="assets/images/illustration-article.svg" alt="illustration-article">
  <span id="label">Learning</span>
<p id="date">Published 21 Dec 2023</p>
<p id="title">HTML & CSS foundations</p>
<p id="intro">These languages are the backbone of every website, defining structure,content, and presentation.</p>
<div id="name">
<img src="assets/images/image-avatar.webp" alt="image-avatar">
<span>Grep Hooper</span>
</div>
</div>
</body>
</html>
